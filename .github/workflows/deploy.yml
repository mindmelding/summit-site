name: Deploy to Cloudflare

# Deploys the landing page Worker (mindmelding.dev/summit) and the waitlist
# Worker (/summit/api/waitlist) from GitHub instead of the Mac.
# Manual only: run it from the Actions tab (or from a cloud session) once Sean
# has said "deploy the site". Nothing deploys on merge.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare API token: Account > Workers Scripts: Edit,
#                          Account > D1: Edit, Zone (mindmelding.dev) > Workers Routes: Edit
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [site, waitlist, both]
        default: site

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  site:
    if: inputs.target == 'site' || inputs.target == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
      - name: Check the live page
        run: curl -fsS -o /dev/null -w "%{http_code} %{url_effective}\n" https://mindmelding.dev/summit/

  waitlist:
    if: inputs.target == 'waitlist' || inputs.target == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: waitlist
          command: |
            d1 migrations apply summit-waitlist --remote
            deploy
